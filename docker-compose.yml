services:
  frontend:
    build: ./frontend
    ports:
      - "8099:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8082:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/testdb
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: